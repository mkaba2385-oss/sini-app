repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        pass_filenames: false
        args: ["src"]
        additional_dependencies:
          - fastapi>=0.115
          - SQLAlchemy>=2.0,<3.0
          - PyJWT>=2.8,<3.0
          - pydantic>=2.5

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false