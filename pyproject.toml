[project]
name = "sini"
version = "0.1.0"
description = "Plateforme d'intégration météo et de suivi agricole"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.5",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "PyJWT>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "mypy>=1.8",
    "ruff>=0.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["postgresql: tests requiring a dedicated PostgreSQL database"]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=src/sini --cov-report=term-missing"

[tool.mypy]
strict = true
python_version = "3.10"
[[tool.mypy.overrides]]
module = ["jwt"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []  